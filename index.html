<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bác Sĩ Diệt Khuẩn: Đại Chiến Mega Boss</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; box-sizing: border-box; }
    .pixel-font { font-family: 'VT323', monospace; }
    canvas { image-rendering: pixelated; }
    .pixel-border {
      box-shadow: 0 -3px 0 0 #0f172a, 0 3px 0 0 #0f172a, -3px 0 0 0 #0f172a, 3px 0 0 0 #0f172a;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-1 select-none">

  <!-- KHUNG ARCADE -->
  <div class="w-full max-w-md bg-slate-900 p-3 rounded-2xl pixel-border border-4 border-emerald-800 flex flex-col gap-2 relative shadow-2xl overflow-hidden">
    
    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="start-screen" class="absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 text-center">
      <div class="pixel-font text-5xl text-emerald-400 mb-1 font-bold animate-pulse">BÁC SĨ DIỆT KHUẨN</div>
      <div class="pixel-font text-2xl text-rose-400 mb-3">TYT THẠCH THẤT</div>
      <p class="text-xs text-slate-300 mb-4 max-w-xs leading-relaxed font-sans">
        <strong>Chiến dịch tiêm chủng mở rộng đảm bảo bao phủ vắc xin đẩy lùi dịch bệnh</strong>
      </p>
      <button onclick="startGame()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 pixel-font text-3xl px-8 py-3 rounded-xl border-2 border-white shadow-lg">
        ▶ BẮT ĐẦU CHIẾN DỊCH 
      </button>
    </div>

    <!-- MÀN HÌNH GAME OVER -->
    <div id="gameover-screen" class="hidden absolute inset-0 bg-rose-950/95 z-50 flex flex-col items-center justify-center p-6 text-center">
      <div class="pixel-font text-5xl text-rose-500 mb-1 font-bold">VỠ TRẬN DỊCH BỆNH!</div>
      <p class="text-sm text-slate-200 mb-2 font-sans">Mega Boss đã áp đảo toàn bộ trạm y tế!</p>
      <div class="pixel-font text-3xl text-amber-300 mb-6">ĐIỂM: <span id="final-score">0</span></div>
      <button onclick="restartGame()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 pixel-font text-2xl px-6 py-2 rounded-lg border-2 border-white">
        CHƠI LẠI
      </button>
    </div>

    <!-- BẢNG CHỈ SỐ -->
    <div class="flex justify-between items-center bg-slate-950 px-3 py-1 rounded pixel-font text-xl border border-emerald-900 text-emerald-400">
      <div>ĐIỂM: <span id="score-text" class="text-white">0</span></div>
      <div>WAVE: <span id="wave-text" class="text-amber-300">1</span></div>
      <div>ĐẠN: <span id="gun-text" class="text-sky-300 font-bold">CẤP 1</span></div>
      <div>TRẠM: <span id="hp-text" class="text-rose-400">❤️❤️❤️</span></div>
    </div>

    <!-- CANVAS GAME (300 x 420) -->
    <div class="relative bg-black rounded-lg border-2 border-slate-700 overflow-hidden flex justify-center">
      <canvas id="gameCanvas" width="300" height="420" class="w-full aspect-[5/7] bg-slate-950"></canvas>
    </div>

    <!-- CỤM NÚT ĐIỀU KHIỂN CẢM ỨNG -->
    <div class="grid grid-cols-4 gap-2 mt-1">
      <button id="btn-left" class="col-span-1 bg-slate-800 active:bg-emerald-600 text-2xl p-4 rounded-xl border border-slate-700 font-bold">◀</button>
      <button id="btn-right" class="col-span-1 bg-slate-800 active:bg-emerald-600 text-2xl p-4 rounded-xl border border-slate-700 font-bold">▶</button>
      <button id="btn-shoot" class="col-span-2 bg-rose-600 active:bg-rose-500 pixel-font text-3xl p-3 rounded-xl border-2 border-white font-bold flex items-center justify-center gap-2">
        💉 <span>BẮN TIÊM</span>
      </button>
    </div>

  </div>

  <script>
    // --- 1. CHIPTUNE AUDIO ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const Cls = window.AudioContext || window.webkitAudioContext;
          if (Cls) this.ctx = new Cls();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      beep(freq, duration = 0.1, type = 'square', vol = 0.08) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      shoot(type = 1) { 
        this.beep(type === 1 ? 750 : (type === 2 ? 880 : 1050), 0.1, 'sawtooth'); 
      },
      hit() { this.beep(250, 0.1, 'square'); },
      explode() { this.beep(85, 0.25, 'sawtooth', 0.12); },
      bossRoar() {
        this.beep(70, 0.5, 'sawtooth', 0.2);
      },
      powerUp() {
        this.beep(523, 0.08); setTimeout(() => this.beep(659, 0.08), 80); setTimeout(() => this.beep(1046, 0.2), 160);
      },
      hurt() { this.beep(120, 0.3, 'sawtooth', 0.15); }
    };

    // --- 2. GAME STATE & SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    let score = 0;
    let hp = 3;
    let wave = 1;
    let isGameOver = false;

    const player = {
      x: 135,
      y: 375,
      w: 30,
      h: 35,
      speed: 4.6,
      gunLevel: 1,
      invincibleTime: 0,
      isMovingLeft: false,
      isMovingRight: false,
      shootCooldown: 0
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerUps = [];
    let particles = [];
    let boss = null; // Quản lý Boss riêng

    const ENEMY_TYPES = [
      { type: 'bacteria', hp: 1, color: '#4ade80', score: 10, w: 20, h: 20, canShoot: false },
      { type: 'virus',    hp: 3, color: '#f87171', score: 35, w: 24, h: 24, canShoot: true },
      { type: 'cholera',  hp: 1, color: '#facc15', score: 15, w: 18, h: 18, canShoot: true },
      { type: 'mosquito', hp: 2, color: '#fb923c', score: 25, w: 20, h: 20, canShoot: false },
      { type: 'superbug', hp: 4, color: '#c084fc', score: 50, w: 26, h: 26, canShoot: true }
    ];

    function spawnWave() {
      enemies = [];
      boss = null;

      // Cứ mỗi 3 wave xuất hiện Boss vi khuẩn khổng lồ
      if (wave % 3 === 0) {
        AudioEngine.bossRoar();
        const bossHp = 40 + (wave - 3) * 20;
        boss = {
          x: 122,
          y: 40,
          w: 56,
          h: 46,
          hp: bossHp,
          maxHp: bossHp,
          vx: 1.5,
          shootCooldown: 60,
          animTimer: 0
        };
        return;
      }

      // Wave thông thường
      const rows = 3 + Math.min(wave, 3);
      const cols = 6;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let type = ENEMY_TYPES[0];
          if (r === 0) type = (wave >= 4) ? ENEMY_TYPES[4] : ENEMY_TYPES[1];
          else if (r === 1) type = ENEMY_TYPES[1];
          else if (r === 2) type = ENEMY_TYPES[3];
          else type = ENEMY_TYPES[2];

          enemies.push({
            x: 22 + c * 44,
            y: 30 + r * 32,
            w: type.w,
            h: type.h,
            hp: type.hp,
            maxHp: type.hp,
            color: type.color,
            score: type.score,
            type: type.type,
            canShoot: type.canShoot,
            animTimer: Math.random() * 100
          });
        }
      }
    }

    let enemyDir = 1;
    let enemySpeedX = 0.7;

    // --- 3. PIXEL SPRITE RENDERER ---
    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function drawPlayer(x, y) {
      if (player.invincibleTime > 0 && Math.floor(player.invincibleTime / 4) % 2 === 0) return;

      drawPixelRect(x + 10, y, 10, 8, '#ffffff');
      drawPixelRect(x + 13, y + 2, 4, 2, '#ef4444');
      drawPixelRect(x + 14, y + 1, 2, 4, '#ef4444');
      drawPixelRect(x + 10, y + 8, 10, 6, '#ffdbac');
      drawPixelRect(x + 12, y + 10, 2, 2, '#000000');
      drawPixelRect(x + 16, y + 10, 2, 2, '#000000');
      drawPixelRect(x + 8, y + 14, 14, 14, '#ffffff');
      drawPixelRect(x + 12, y + 14, 6, 14, '#38bdf8');
      drawPixelRect(x + 8, y + 28, 6, 7, '#0284c7');
      drawPixelRect(x + 16, y + 28, 6, 7, '#0284c7');

      const liquidColor = player.gunLevel === 1 ? '#38bdf8' : (player.gunLevel === 2 ? '#facc15' : '#a855f7');
      drawPixelRect(x + 22, y - 6, 3, 10, '#cbd5e1');
      drawPixelRect(x + 20, y + 4, 7, 16, liquidColor);
      drawPixelRect(x + 22, y + 8, 3, 6, '#ffffff');
    }

    function drawEnemy(e) {
      e.animTimer += 0.1;
      const wobble = Math.sin(e.animTimer) * 2;

      if (e.type === 'virus') {
        drawPixelRect(e.x + 3, e.y + 3, 18, 18, e.color);
        drawPixelRect(e.x + 10, e.y - 2, 4, 4, '#dc2626');
        drawPixelRect(e.x + 10, e.y + 22, 4, 4, '#dc2626');
        drawPixelRect(e.x - 2, e.y + 10, 4, 4, '#dc2626');
        drawPixelRect(e.x + 22, e.y + 10, 4, 4, '#dc2626');
        drawPixelRect(e.x + 6, e.y + 8, 3, 3, '#000');
        drawPixelRect(e.x + 15, e.y + 8, 3, 3, '#000');
      } else if (e.type === 'superbug') {
        drawPixelRect(e.x + 2, e.y + 2, 22, 22, e.color);
        drawPixelRect(e.x + 6, e.y + 6, 4, 4, '#ffffff');
        drawPixelRect(e.x + 16, e.y + 6, 4, 4, '#ffffff');
        ctx.strokeStyle = '#e9d5ff';
        ctx.lineWidth = 1;
        ctx.strokeRect(e.x - 1, e.y - 1, 28, 28);
      } else if (e.type === 'mosquito') {
        drawPixelRect(e.x + 8, e.y + 4, 4, 12, e.color);
        const wingY = wobble > 0 ? 0 : 4;
        drawPixelRect(e.x + 1, e.y + wingY, 7, 3, '#93c5fd');
        drawPixelRect(e.x + 12, e.y + wingY, 7, 3, '#93c5fd');
        drawPixelRect(e.x + 9, e.y + 16, 2, 4, '#ffffff');
      } else if (e.type === 'cholera') {
        drawPixelRect(e.x + 3, e.y + wobble, 12, 14, e.color);
        drawPixelRect(e.x + 9, e.y + 14 + wobble, 6, 4, e.color);
        drawPixelRect(e.x + 6, e.y + 4 + wobble, 2, 2, '#000');
      } else {
        drawPixelRect(e.x + 2, e.y + wobble, 16, 16, e.color);
        drawPixelRect(e.x + 5, e.y + 5 + wobble, 3, 3, '#14532d');
        drawPixelRect(e.x + 12, e.y + 5 + wobble, 3, 3, '#14532d');
      }
    }

    // Vẽ Boss Khổng Lồ
    function drawBoss(b) {
      b.animTimer += 0.04;
      const wobble = Math.sin(b.animTimer) * 3;

      // Thân chính quái vật
      drawPixelRect(b.x + 6, b.y + wobble, b.w - 12, b.h, '#7e22ce');
      drawPixelRect(b.x + 2, b.y + 8 + wobble, b.w - 4, b.h - 16, '#9333ea');
      
      // Các gai độc xúc tu xung quanh
      drawPixelRect(b.x + 10, b.y - 6 + wobble, 6, 8, '#ec4899');
      drawPixelRect(b.x + b.w - 16, b.y - 6 + wobble, 6, 8, '#ec4899');
      drawPixelRect(b.x - 6, b.y + 16 + wobble, 8, 8, '#ec4899');
      drawPixelRect(b.x + b.w - 2, b.y + 16 + wobble, 8, 8, '#ec4899');

      // Mắt quỷ đỏ rực
      drawPixelRect(b.x + 14, b.y + 14 + wobble, 8, 8, '#ef4444');
      drawPixelRect(b.x + b.w - 22, b.y + 14 + wobble, 8, 8, '#ef4444');
      drawPixelRect(b.x + 16, b.y + 16 + wobble, 4, 4, '#fef08a');
      drawPixelRect(b.x + b.w - 20, b.y + 16 + wobble, 4, 4, '#fef08a');

      // Miệng đầy răng sắc nhọn
      drawPixelRect(b.x + 16, b.y + 30 + wobble, 24, 6, '#0f172a');
      drawPixelRect(b.x + 18, b.y + 30 + wobble, 4, 3, '#ffffff');
      drawPixelRect(b.x + 26, b.y + 30 + wobble, 4, 3, '#ffffff');
      drawPixelRect(b.x + 34, b.y + 30 + wobble, 4, 3, '#ffffff');

      // Thanh máu HP của Boss trên đỉnh đầu
      const barW = 70;
      const barX = b.x + (b.w - barW) / 2;
      const barY = b.y - 12;
      drawPixelRect(barX, barY, barW, 5, '#1e293b');
      const curHpW = Math.max(0, (b.hp / b.maxHp) * barW);
      drawPixelRect(barX, barY, curHpW, 5, '#ef4444');
    }

    function drawPowerUp(p) {
      drawPixelRect(p.x + 2, p.y + 4, 12, 14, '#ffffff');
      drawPixelRect(p.x + 3, p.y + 5, 10, 12, p.color);
      drawPixelRect(p.x + 4, p.y, 8, 4, '#f59e0b');
      drawPixelRect(p.x + 7, p.y + 8, 2, 6, '#ffffff');
      drawPixelRect(p.x + 5, p.y + 10, 6, 2, '#ffffff');
    }

    // --- 4. BẮN & NỔ ---
    function shootBullet() {
      if (player.shootCooldown > 0) return;
      AudioEngine.shoot(player.gunLevel);

      const px = player.x + 22;
      const py = player.y - 6;

      if (player.gunLevel === 1) {
        bullets.push({ x: px, y: py, vx: 0, vy: -7.5, color: '#38bdf8' });
      } else if (player.gunLevel === 2) {
        bullets.push({ x: px - 6, y: py, vx: 0, vy: -8, color: '#facc15' });
        bullets.push({ x: px + 6, y: py, vx: 0, vy: -8, color: '#facc15' });
      } else {
        bullets.push({ x: px, y: py, vx: 0, vy: -8.5, color: '#c084fc' });
        bullets.push({ x: px - 4, y: py, vx: -1.8, vy: -8, color: '#c084fc' });
        bullets.push({ x: px + 4, y: py, vx: 1.8, vy: -8, color: '#c084fc' });
      }

      player.shootCooldown = 11;
    }

    function createExplosion(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 18,
          color: color
        });
      }
    }

    // --- 5. VÒNG LẶP ENGINE CẬP NHẬT ---
    function update() {
      if (isGameOver) return;

      if (player.isMovingLeft && player.x > 5) player.x -= player.speed;
      if (player.isMovingRight && player.x < canvas.width - player.w - 5) player.x += player.speed;
      if (player.shootCooldown > 0) player.shootCooldown--;
      if (player.invincibleTime > 0) player.invincibleTime--;

      // 1. Cập nhật đạn người chơi
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.y < -15 || b.x < 0 || b.x > canvas.width) {
          bullets.splice(i, 1);
          continue;
        }

        // Bắn trúng Boss
        if (boss && b.x < boss.x + boss.w && b.x + 3 > boss.x && b.y < boss.y + boss.h && b.y + 12 > boss.y) {
          boss.hp--;
          AudioEngine.hit();
          createExplosion(b.x, b.y, '#f43f5e', 2);
          bullets.splice(i, 1);

          if (boss.hp <= 0) {
            AudioEngine.explode();
            createExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, '#a855f7', 35);
            score += 300;
            document.getElementById('score-text').innerText = score;

            // Diệt Boss CHẮC CHẮN RỚT 100% LỌ THUỐC BỔ
            powerUps.push({
              x: boss.x + boss.w / 2 - 8,
              y: boss.y + boss.h / 2,
              w: 16, h: 18, vy: 1.4, color: '#facc15'
            });

            boss = null;
          }
          continue;
        }

        // Bắn trúng vi khuẩn thường
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (b.x < e.x + e.w && b.x + 3 > e.x && b.y < e.y + e.h && b.y + 12 > e.y) {
            e.hp--;
            AudioEngine.hit();
            bullets.splice(i, 1);

            if (e.hp <= 0) {
              AudioEngine.explode();
              createExplosion(e.x + e.w / 2, e.y + e.h / 2, e.color, 12);
              score += e.score;
              document.getElementById('score-text').innerText = score;

              // TINH CHỈNH: Giảm tỷ lệ rơi xuống 5% và chỉ rớt từ quái cứng
              if (Math.random() < 0.1 && (e.type === 'virus' || e.type === 'superbug')) {
                powerUps.push({
                  x: e.x + e.w / 2 - 8,
                  y: e.y,
                  w: 16, h: 18, vy: 1.5, color: '#38bdf8'
                });
              }

              enemies.splice(j, 1);
            }
            break;
          }
        }
      }

      // 2. Logic Boss Tấn Công & Di chuyển
      if (boss) {
        boss.x += boss.vx;
        if (boss.x < 15 || boss.x > canvas.width - boss.w - 15) {
          boss.vx *= -1;
        }

        boss.shootCooldown--;
        if (boss.shootCooldown <= 0) {
          boss.shootCooldown = 45; // Nhịp bắn đạn chùm
          // Bắn 3 tia độc tố hình quạt
          enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, w: 6, h: 10, vx: 0, vy: 3.2 });
          enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, w: 6, h: 10, vx: -1.2, vy: 3.0 });
          enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, w: 6, h: 10, vx: 1.2, vy: 3.0 });
        }
      }

      // 3. Vi khuẩn thường phản công
      if (!boss && Math.random() < 0.03 && enemies.length > 0) {
        const shooters = enemies.filter(en => en.canShoot);
        if (shooters.length > 0) {
          const s = shooters[Math.floor(Math.random() * shooters.length)];
          enemyBullets.push({
            x: s.x + s.w / 2 - 2,
            y: s.y + s.h,
            w: 5, h: 9, vx: 0,
            vy: 2.8 + wave * 0.15
          });
        }
      }

      // Cập nhật giọt độc tố
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx || 0;
        eb.y += eb.vy;

        if (player.invincibleTime <= 0 &&
            eb.x < player.x + player.w && eb.x + eb.w > player.x &&
            eb.y < player.y + player.h && eb.y + eb.h > player.y) {
          enemyBullets.splice(i, 1);
          takeHit();
          continue;
        }

        if (eb.y > canvas.height + 10) enemyBullets.splice(i, 1);
      }

      // 4. Cập nhật Lọ Thuốc Bổ rơi
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.y += pu.vy;

        if (pu.x < player.x + player.w && pu.x + pu.w > player.x &&
            pu.y < player.y + player.h && pu.y + pu.h > player.y) {
          AudioEngine.powerUp();
          powerUps.splice(i, 1);

          if (player.gunLevel < 3) {
            player.gunLevel++;
            const labels = ["CẤP 1", "ĐẠN ĐÔI", "ĐẠN XÒE 3"];
            document.getElementById('gun-text').innerText = labels[player.gunLevel - 1];
            document.getElementById('gun-text').className = player.gunLevel === 2 ? "text-amber-300 font-bold" : "text-fuchsia-400 font-bold";
          } else {
            if (hp < 3) {
              hp++;
              document.getElementById('hp-text').innerText = '❤️'.repeat(hp);
            }
          }
          continue;
        }

        if (pu.y > canvas.height + 20) powerUps.splice(i, 1);
      }

      // 5. Di chuyển dàn vi khuẩn thường
      if (!boss) {
        let hitWall = false;
        for (let e of enemies) {
          e.x += enemyDir * enemySpeedX;
          if (e.x < 4 || e.x > canvas.width - e.w - 4) hitWall = true;
        }

        if (hitWall) {
          enemyDir *= -1;
          for (let e of enemies) {
            e.y += 12;
            if (e.y >= player.y - 12) {
              takeHit(true);
              enemies = [];
              break;
            }
          }
        }
      }

      // 6. Cập nhật hạt nổ
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Chuyển Wave
      if (!boss && enemies.length === 0) {
        wave++;
        enemySpeedX = Math.min(2.4, 0.7 + wave * 0.15);
        document.getElementById('wave-text').innerText = wave;
        spawnWave();
      }

      // --- VẼ RA MÀN HÌNH ---
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Nền vũ trụ / tế bào
      ctx.fillStyle = '#1e293b';
      for (let i = 0; i < 24; i++) {
        ctx.fillRect((i * 41) % canvas.width, (i * 73 + wave * 8) % canvas.height, 2, 2);
      }

      // Đạn bác sĩ
      for (let b of bullets) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, 3, 12);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(b.x, b.y - 2, 3, 3);
      }

      // Giọt độc tố
      for (let eb of enemyBullets) {
        drawPixelRect(eb.x, eb.y, eb.w, eb.h, '#22c55e');
        drawPixelRect(eb.x + 1, eb.y + 1, 3, 3, '#86efac');
      }

      // Lọ thuốc
      for (let pu of powerUps) drawPowerUp(pu);

      // Vi khuẩn thường
      for (let e of enemies) drawEnemy(e);

      // Vẽ Mega Boss nếu có
      if (boss) drawBoss(boss);

      // Hiệu ứng nổ
      for (let p of particles) drawPixelRect(p.x, p.y, 2, 2, p.color);

      // Bác sĩ
      drawPlayer(player.x, player.y);

      requestAnimationFrame(update);
    }

    function takeHit(wipeWave = false) {
      AudioEngine.hurt();
      hp--;
      player.invincibleTime = 60;
      if (player.gunLevel > 1) {
        player.gunLevel--;
        const labels = ["CẤP 1", "ĐẠN ĐÔI", "ĐẠN XÒE 3"];
        document.getElementById('gun-text').innerText = labels[player.gunLevel - 1];
      }

      document.getElementById('hp-text').innerText = '❤️'.repeat(Math.max(0, hp));
      createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 16);

      if (hp <= 0) {
        isGameOver = true;
        document.getElementById('final-score').innerText = score;
        document.getElementById('gameover-screen').classList.remove('hidden');
      } else if (wipeWave) {
        spawnWave();
      }
    }

    // --- 6. ĐIỀU KHIỂN ---
    window.addEventListener('keydown', (e) => {
      AudioEngine.init();
      if (e.key === 'ArrowLeft' || e.key === 'a') player.isMovingLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd') player.isMovingRight = true;
      if (e.key === ' ' || e.key === 'ArrowUp') shootBullet();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') player.isMovingLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd') player.isMovingRight = false;
    });

    function bindTouch(btnId, startFn, endFn) {
      const el = document.getElementById(btnId);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); AudioEngine.init(); startFn(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); endFn(); });
      el.addEventListener('mousedown', () => { AudioEngine.init(); startFn(); });
      el.addEventListener('mouseup', endFn);
      el.addEventListener('mouseleave', endFn);
    }

    bindTouch('btn-left', () => player.isMovingLeft = true, () => player.isMovingLeft = false);
    bindTouch('btn-right', () => player.isMovingRight = true, () => player.isMovingRight = false);

    let shootInterval = null;
    bindTouch('btn-shoot', 
      () => { shootBullet(); shootInterval = setInterval(shootBullet, 200); },
      () => { clearInterval(shootInterval); }
    );

    function startGame() {
      AudioEngine.init();
      document.getElementById('start-screen').classList.add('hidden');
      score = 0;
      hp = 3;
      wave = 1;
      player.gunLevel = 1;
      isGameOver = false;
      spawnWave();
      update();
    }

    function restartGame() {
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('hp-text').innerText = '❤️❤️❤️';
      document.getElementById('score-text').innerText = '0';
      document.getElementById('wave-text').innerText = '1';
      document.getElementById('gun-text').innerText = 'CẤP 1';
      bullets = [];
      enemyBullets = [];
      powerUps = [];
      particles = [];
      startGame();
    }
  </script>
</body>
</html>
